<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.pinimg.com/750x/9a/ca/78/9aca78a052501b6445069daf6528e700.jpg">
    <title>StockFlow | Criar Conta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 40px; /* Estilo arredondado do seu print */
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border-top: 8px solid #1a4bc1; /* Linha azul do topo */
        }

        .logo-section h2 {
            font-weight: 700;
            font-size: 26px;
            color: #1a1a1a;
            margin-bottom: 5px;
        }

        .logo-section p {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .form-label {
            display: block;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            color: #444;
            text-transform: uppercase;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .input-group-custom {
            background-color: #eef2f7; /* Fundo azulado dos inputs */
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
            margin-bottom: 10px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .input-group-custom:focus-within {
            border-color: #cbd5e0;
            background-color: #fff;
        }

        .input-group-custom i {
            color: #94a3b8;
            margin-right: 12px;
        }

        .input-group-custom input {
            background: transparent;
            border: none;
            padding: 12px 0;
            width: 100%;
            outline: none;
            font-size: 15px;
        }

        .info-text {
            text-align: left;
            font-size: 11px;
            color: #777;
            margin-bottom: 15px;
            margin-left: 5px;
        }

        .btn-primary-custom {
            background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-primary-custom:hover {
            transform: scale(1.02);
        }

        .return-link {
            display: block;
            margin-top: 25px;
            text-decoration: none;
            color: #64748b;
            font-size: 14px;
        }

        .error-msg {
            color: #e11d48;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>

    <script>
        function togglePasswordVisibility() {
            var passwordInput = document.getElementById("password");
            var passwordIcon = document.getElementById("eye-icon");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                passwordIcon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                passwordInput.type = "password";
                passwordIcon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function handleRegistration() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            var confirm_password = document.getElementById("confirm_password").value;
            let errorDiv = document.getElementById("error-message");
            
            if (username.trim() === "" || password.trim() === "" || confirm_password.trim() === "") {
                errorDiv.textContent = "Por favor, preencha todos os campos.";
                return false;
            }
            if (password !== confirm_password) {
                errorDiv.textContent = "As senhas não coincidem.";
                return false;
            }
            if (password.length < 3) {
                errorDiv.textContent = "A senha deve ter pelo menos 3 caracteres.";
                return false;
            }
            return true;
        }
    </script>
</head>
<body>

<div class="auth-card">
    <div class="logo-section">
        <i class="fas fa-layer-group" style="font-size: 30px; margin-bottom: 10px;"></i>
        <h2>StockFlow</h2>
        <p>Seu inventário em um novo nível.</p>
    </div>

    <form method="post" onsubmit="return handleRegistration();">
        {% csrf_token %}
        
        <label for="username" class="form-label">Identificação</label>
        <div class="input-group-custom">
            <i class="fas fa-user"></i>
            <input type="text" id="username" name="username" placeholder="Usuário" pattern=".*\d{3,}.*" required>
        </div>
        <p class="info-text">Deve conter pelo menos 3 números</p>
        
        <label for="password" class="form-label">Senha de Acesso</label>
        <div class="input-group-custom">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" pattern=".*\d{3,}.*" required>
            <i id="eye-icon" class="fas fa-eye" style="cursor:pointer; color:#2563eb" onclick="togglePasswordVisibility()"></i>
        </div>
        <p class="info-text">Deve conter pelo menos 3 números</p>
        
        <label for="confirm_password" class="form-label">Confirmar Senha</label>
        <div class="input-group-custom">
            <i class="fas fa-check-double"></i>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repita a senha" required>
        </div>
        
        <p id="error-message" class="error-msg"></p>
        
        <button type="submit" class="btn-primary-custom">CRIAR CONTA</button>
    </form>
    
    <a href="/" class="return-link">← Voltar para o login</a>
</div>

</body>
</html>
