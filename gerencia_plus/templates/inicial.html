<!DOCTYPE html>
<html lang="pt-br" class="min-vh-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StockFlow | Cadastro de Estoque</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #3575b9;
            --soft-bg: #f3f6f9;
            --dark-navbar: #1a1a1a;
            --white: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--soft-bg);
            color: #334155;
        }

        /* Navbar Customizada */
        .navbar {
            background-color: var(--dark-navbar) !important;
            border-bottom: 2px solid var(--primary-blue);
            padding: 1rem 0;
        }

        .navbar-brand.stockflow {
            font-weight: 700;
            color: #4ea1ff !important;
            letter-spacing: 1px;
        }

        .nav-link {
            color: rgba(255,255,255,0.8) !important;
            font-weight: 500;
            margin: 0 10px;
        }

        /* Card Principal */
        .main-card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 40px;
            margin-top: 40px;
            margin-bottom: 40px;
            transition: opacity 1s ease; /* Para o efeito de saída */
        }

        .section-title {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Inputs e Formulários */
        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }

        .form-control, .form-select {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(53, 117, 185, 0.1);
            outline: none;
        }

        /* Botão */
        .btn-add {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-weight: 700;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-add:hover {
            background-color: #2a5d94;
            transform: translateY(-2px);
        }

        /* Animação de Saída */
        .fadeOut {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand stockflow" href="#">STOCKFLOW</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'home' %}">Página Inicial</a>
                <a class="nav-link" href="{% url 'salvo' %}">Produtos Cadastrados</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="main-card" id="formContainer">
                    <h3 class="section-title">
                        <i class="fas fa-plus-circle text-primary"></i> 
                        Novo Cadastro de Produto
                    </h3>

                    <form id="productForm" action="{% url 'salvo' %}" method="POST">
                        {% csrf_token %}
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label for="nome-produto">Nome do Produto</label>
                                <input type="text" id="nome-produto" name="nome-produto" class="form-control" placeholder="Ex: Cerveja IPA 500ml" required>
                            </div>
                            <div class="col-md-6">
                                <label for="quantidade">Quantidade em Estoque</label>
                                <input type="number" id="quantidade" name="quantidade" class="form-control" placeholder="0" required>
                            </div>

                            <div class="col-md-12">
                                <label for="descricao">Descrição</label>
                                <textarea id="descricao" name="descricao" class="form-control" rows="2" placeholder="Detalhes do produto..." required></textarea>
                            </div>

                            <div class="col-md-4">
                                <label for="peso-estoque">Peso (Kg)</label>
                                <input type="number" step="0.01" id="peso-estoque" name="peso-estoque" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="col-md-4">
                                <label for="preco">Preço (R$)</label>
                                <input type="number" step="0.01" id="preco" name="preco" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="col-md-4">
                                <label for="fornecedor">Fornecedor</label>
                                <input type="text" id="fornecedor" name="fornecedor" class="form-control" placeholder="Distribuidora X" required>
                            </div>

                            <div class="col-md-6">
                                <label for="categoria">Categoria</label>
                                <select id="categoria" name="categoria" class="form-select" required>
                                    <option selected disabled value="">Selecione uma categoria</option>
                                    <option value="Alimentos">Alimentos</option>
                                    <option value="Bebidas">Bebidas</option>
                                    <option value="Moda">Moda</option>
                                    <option value="Limpeza">Limpeza</option>
                                    <option value="Eletrônicos">Eletrônicos</option>
                                    <option value="Doces">Doces</option>
                                    <option value="Higiene">Higiene</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="data-entrada">Data de Entrada</label>
                                <input type="date" id="data-entrada" name="data-entrada" class="form-control" required>
                            </div>
                        </div>

                        <button type="submit" class="btn-add" id="btnSubmit">
                            <i class="fas fa-check-circle me-2"></i> Finalizar Cadastro
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // 1. Definir data de hoje automaticamente
            const hoje = new Date().toISOString().split('T')[0];
            $('#data-entrada').val(hoje);

            // 2. Evento de envio do formulário
            $('#productForm').on('submit', function(e) {
                const btn = $('#btnSubmit');
                const card = $('#formContainer');

                // Mudar texto do botão e mostrar spinner
                btn.html('<i class="fas fa-spinner fa-spin me-2"></i> Processando...');
                btn.prop('disabled', true);

                // Efeito de Fade Out (Opcional, mas estava no seu código)
                // Nota: Se você for redirecionar após o POST, o FadeOut é muito rápido.
                // Aqui ele acontece enquanto o navegador processa o envio.
                setTimeout(function() {
                    card.addClass('fadeOut');
                }, 500);
            });

            // 3. Pequeno ajuste para garantir que decimais funcionem bem (troca vírgula por ponto)
            $('#preco, #peso-estoque').on('input', function() {
                this.value = this.value.replace(/,/g, '.');
            });
        });
    </script>
</body>
</html>
